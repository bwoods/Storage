[workspace]
resolver = "3"
members = [
    "lib", "bin",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Bryan Woods"]
repository = "https://github.com/bwoods/Storage"

[workspace.dependencies]
frame = { path = "lib" }
arrow = { version = "59", features = ["prettyprint", "csv", "json", "ipc"] }
#arrow-arith = "59"
arrow-array = "59"
arrow-buffer = "59"
#arrow-cast = "59"
#arrow-csv = "59"
arrow-schema = "59"
#arrow-select = "59"
serde_arrow = { version = "0.15", features = ["arrow-59"] }
serde = { version = "1.0", features = ["derive"] }

itertools = "0.15.0"
ouroboros = "0.18.5"
#log = { version = "0.4.34", features = ["kv"] }

# loom expects its dependencies to be in the workspace
fsst = { package = "fsst-rs", version = "0.6" }
anyhow = "1.0"
byteorder = "1.5"
crc32fast = "1.5"
criterion = "0.8"
lz4_flex = "0.14"
memmap2 = "0.9"
num = "0.4"
num-traits = "0.2"
rayon = "1.12"
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
zerocopy = "0.8"
zstd = "0.14"


[profile.release]
codegen-units = 1
incremental = false
debug = false
strip = true
lto = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev.package."*"]
opt-level = 3
